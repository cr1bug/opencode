name: publish
run-name: "Manual Windows Build"

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: 1.17.99
          OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-pc-windows-msvc
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@1.17.99
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: desktop@1.17.99

      - name: Package
        run: npx electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: packages/desktop/dist/*.exe

  publish:
    needs: build-desktop-windows
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: /tmp/desktop

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v1.17.99" \
            /tmp/desktop/*.exe \
            --clobber \
            --repo "${{ github.repository }}" || \
          echo "Release v1.17.99 not found, skipping upload"
